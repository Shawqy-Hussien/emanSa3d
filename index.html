<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#053c31" />
    <meta name="description" content="لوحة إدارة الصيدليات والمبيعات والمخزون" />
    <title>إدارة الصيدليات | لوحة التحكم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="التنقل الرئيسي">
        <a class="brand" href="#" data-page="الرئيسية">
          <span class="brand-mark" aria-hidden="true">+</span>
          <span class="brand-copy"><strong>إدارة الصيدليات</strong><small>نظام إدارة متكامل</small></span>
          <span class="brand-status" aria-hidden="true"></span>

        <nav class="nav-list" id="navigation"></nav>
        <div class="sidebar-footer" id="account-area"></div>
      </aside>

      <main class="main-content">
        <header class="mobile-header">
          <button class="header-logout" data-action="logout" aria-label="تسجيل الخروج" title="تسجيل الخروج">↪</button>
          <a class="mobile-brand" href="#" data-page="الرئيسية"><span class="brand-copy"><strong>إدارة الصيدليات</strong><small id="mobile-user-role">مدير الفروع</small></span></a>
          <button class="header-add" data-action="quick-add" aria-label="إضافة حركة">+</button>
        </header>
        <div id="page-content"></div>
      </main>

      <nav class="mobile-nav" id="mobile-navigation" aria-label="التنقل السفلي"></nav>
      <div id="mobile-menu" class="mobile-menu" hidden></div>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
